[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amortix"
version = "0.1.0"
description = "Amortized Bayesian parameter recovery for dynamical systems via conditional flow matching"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ivan Oseledets", email = "ivan.oseledets@gmail.com" }]
keywords = ["simulation-based-inference", "flow-matching", "sde", "bayesian", "amortized-inference"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["torch>=2.0", "numpy", "scipy"]

[project.optional-dependencies]
plot = ["matplotlib"]
sde = ["torchsde"]   # optional: production SDE integrators (Euler-Maruyama is built in)

[project.scripts]
amortix = "amortix.cli:main"

[dependency-groups]
dev = ["pytest>=8.4.2"]

[tool.hatch.build.targets.wheel]
packages = ["amortix"]

[tool.hatch.build.targets.sdist]
include = ["amortix", "examples", "tests", "/*.md", "LICENSE", "report/techreport.pdf"]
exclude = ["results", "examples/*.png"]
